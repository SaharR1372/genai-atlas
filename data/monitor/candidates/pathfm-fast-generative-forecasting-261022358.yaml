summary: Time series foundation models are becoming increasingly popular for general-purpose forecasting.
  However, most leading models predict marginal quantiles, leaving the dependence structure of future
  trajectories unspecified. This distinction matters for trajectory-dependent quantities such as cumulative
  demand, peak load, and event timing, yet point and marginal scores do not reveal it. To model this dependence,
