summary: Tables in real-world documents, including scientific papers, financial reports, and statistical
  summaries, frequently use merged cells, multi-level headers, and sectioned layouts. Yet the lightweight
  formats LLMs handle best (Markdown, CSV) cannot express these structures, while expressive formats (HTML,
  LaTeX) impose excessive token cost and parsing complexity. To enable systematic analysis of this trade-off,
  we introduce a taxonomy decomposing table structure into six atomic features (F1-F6) and corresponding
  complexity levels (L1-L6), and construct STB (Synthetic Table Benchmark), a controlled benchmark with
