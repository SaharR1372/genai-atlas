summary: 'We study Text-and-Image-to-Image (TI2I) flow matching methods for controllable image editing.
  In a broader generative modeling context, Classifier-Free Guidance (CFG) is established as a key component
  responsible for high quality outputs. However, we argue that its role in TI2I modeling is poorly understood.
  Specifically, we make the surprising observation that the CFG mechanism is implicitly harmful for editing
  in the noisy phase of flow modeling, hindering instruction following and controllability. We propose
  a simple correction in the early flow steps, enabling a richer alignment-preservation tradeoff at no
  extra cost. The effectiveness of our approach is demonstrated on both pixel-space '
