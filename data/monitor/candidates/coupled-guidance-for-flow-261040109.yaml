summary: Guidance methods are essential tools for steering the generation process in diffusion models,
  improving the generalizability of stochastic robotic controllers and enabling high-quality controlled
  image synthesis. Despite strong parallels between flow-matching and diffusion, integrating guidance
  into flow-matching models remains quite challenging. Recent work has proposed general guidance frameworks
  for flow-matching, however, they are direct adaptations of diffusion guidance methods and can prove
  unstable. In this work, we conduct a theoretical analysis of guidance in flow-matching and show that
  a naive translation of diffusion-based guidance to flow-matching breaks the coupling distribution
