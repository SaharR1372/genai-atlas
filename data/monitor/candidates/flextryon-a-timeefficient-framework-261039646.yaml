summary: 'Virtual try-on has achieved remarkable progress in recent years, yet most existing methods are
  designed for a specific scenario, such as cloth-to-person or person-to-person try-on, and often require
  separate conditioning strategies and processing pipelines for different settings. We present FlexTry-On,
  a unified and time-efficient diffusion-based framework for diverse virtual try-on scenarios, including
  cloth-to-person, person-to-person, cross-domain, and in-the-wild settings. FlexTry-On adopts a common
  conditioning formulation, where a text-aware condition extraction strategy converts heterogeneous garment
