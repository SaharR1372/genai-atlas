summary: As state-of-the-art text-to-image flow models achieve near-photorealistic quality, controlling
  their outputs, e.g., suppressing harmful content while promoting benign alternatives, has become a central
  challenge. The current steering paradigm consists of adding a global steering vector to selected activations.
  While functional, a fixed and example-agnostic vector applied uniformly along the entire trajectory
  cannot adapt to the changing state of the generation and often causes unintended global changes. We
