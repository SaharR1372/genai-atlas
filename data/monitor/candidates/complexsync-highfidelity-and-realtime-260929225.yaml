summary: 'Lip synchronization aims to generate visual lip dynamics that align precisely with speech audio.
  Despite the high generation quality of diffusion models, they often struggle in complex scenarios and
  suffer from prohibitive inference latency, limiting real-world deployment. We present ComplexSync, a
  unified diffusion-based framework that enables real-time, high-fidelity lip sync under complex conditions.
  First, we introduce a dual-stream joint training strategy to mitigate information leakage from reference
