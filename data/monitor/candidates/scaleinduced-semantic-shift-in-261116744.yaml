summary: 'Visual content in multimedia systems may be resized, compressed, or re-rendered before it is
  interpreted by a vision-language model. We study a security failure mode in which these transformations
  change the machine-readable semantics of an image: a textual instruction is not recovered at a $512\times512$
  presentation resolution under our evaluation protocol but becomes recoverable after aggressive downsampling.
  We formulate this behavior as Scale-Induced Semantic Shift (SISS) and develop a closed-loop black-box
  framework that combines dual-scale verification, selective self-hardening, shallow-layer low-rank adaptation,
