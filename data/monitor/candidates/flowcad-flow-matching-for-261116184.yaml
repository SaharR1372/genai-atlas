summary: Contextual anomaly detection in tabular data aims to identify objects whose behavior is unexpected
  under their contextual conditions. In data-engineering pipelines, this task screens table rows whose
  measurements violate context-dependent integrity relationships. Most existing approaches rely on either
  shallow conditional models with limited distributional expressiveness or localized estimators that require
  per-context modeling, making it difficult to capture complex conditional relationships and scale to
  high-dimensional settings. We propose Flow-CAD, a new framework for contextual anomaly detection based
