summary: The pursuit of fair and equitable AI in human-centric tasks is critically hindered by the inherent
  biases and privacy risks of real-world datasets, which offer imbalanced representations of identity
  and often contain sensitive personal information. Consequently, state-of-the-art generative models trained
  on this skewed data exhibit unfair performance, particularly in identity-preserving generation. In this
  work we propose a pipeline for controllable generation of dataset with diverse faces for generative
