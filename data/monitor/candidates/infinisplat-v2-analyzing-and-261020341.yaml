summary: Feed-forward Gaussian reconstruction builds 3D scenes directly from input images for novel view
  rendering, but learning Gaussian attributes from predicted geometry for high-quality rendering under
  large viewpoint changes remains challenging. We analyze limitations in Gaussian attribute learning and
  introduce InfiniSplat v2, which improves rendering quality through architectural and training changes.
  Our method decouples geometry and attribute prediction with a frozen geometry branch, aligns predicted
  Gaussians using ground-truth camera poses during training, and adopts large-angle target view supervision.
