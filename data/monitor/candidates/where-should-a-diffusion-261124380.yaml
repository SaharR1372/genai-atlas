summary: Representation Alignment (REPA) significantly accelerates Diffusion Transformer training by guiding
  intermediate student features with a pretrained visual teacher, yet existing methods typically attach
  supervision to a single fixed layer. As student representations evolve, however, we find that the most
  effective layer for alignment varies across training stages. To track this evolving layer suitability
  online without costly search, we measure gradient compatibility between the flow-matching and alignment
