summary: 'Multi-modal Large Language Models (MLLMs) have seen broad adoption, but their biases are still
  far less examined than those of standard LLMs, creating possible social harms when deployed in real-world
  settings. Prior efforts to extend bias analyses from LLMs into the multi-modal space either cover only
  a few bias categories or do not ensure that the groups being compared are clearly addressed by visual
  cues in the images. To overcome these limitations, we introduce Melange, a wide-ranging synthetic visual
  benchmark covering seven categories for assessing social biases in MLLMs. It is grounded in the widely
  used language-only BBQ dataset (Bias Benchmark for Question Answering) from BigBench, '
