summary: Multimodal encoders such as CLIP underlie many downstream systems, but their web-scale training
  data embed harmful associations that safety alignment must suppress without unnecessarily changing benign
  representations. Because ethical and practical constraints prevent collecting real unsafe content at
  scale, existing datasets pair safe real samples with generated counterparts, but label every generated
  sample unsafe, even when one modality is individually safe. To address this, we introduce ShieldCLIP,
  the first framework to condition safety alignment on the observed safety state of each modality rather
  than the origin of a sample, preserving safe content while redirecting only what is unsaf
