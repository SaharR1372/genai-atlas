summary: 'Pixel-space generative Transformers typically use one token per image patch, so capturing finer
  detail requires more tokens and makes global attention increasingly expensive. We observe that finer
  detail does not necessarily require more global communication: low-frequency structure benefits from
  global exchange, while high-frequency detail can be modeled locally. Based on this insight, we introduce
  SpecSlot, a pixel-space rectified-flow Transformer that decouples output detail from the length of the
  global attention sequence. SpecSlot expands each spatial anchor into multiple slots, each assigned a
  disjoint band of DCT coefficients; this separates anchor density from spectral subdivision. O'
