summary: Multimodal reasoning requires models to draw on information from multiple modalities throughout
  the reasoning process. Yet existing methods often concatenate modality-specific thought tokens in a
  single sequence, leaving the model to bridge representational differences as it reasons across modalities.
  We introduce Uni-LaDiR (Unified Latent Diffusion Reasoner), a framework that brings these thoughts into
