summary: 'Modern diffusion models are trained on massive datasets that often include copyrighted or private
  images. Membership inference attacks (MIAs) address this by testing whether a given image was in a model''s
  training set. The standard approach scores an image by its reconstruction loss and flags low-loss images
  as members. This often fails because some images are simply easier to reconstruct than others, so a
  simple unseen image can score a lower loss than a complex training image. Difficulty calibration separates
  memorization from how difficult an image is to begin with. We show how to calibrate along two axes of
  time: training time and diffusion time. First, across training time, we introduce'
