summary: Generative image compression (GIC) delivers strong perceptual quality at low bitrates. However,
  GIC methods with strong perceptual quality often rely on pretrained diffusion models with high latency,
  while recent lightweight GIC methods reduce latency but deliver lower perceptual quality. We observe
  that, for lightweight GIC methods at low bitrates, coarse deterministic quantization can collapse nearby
  encoder latents corresponding to different fine details to the same point, making these details difficult
  to recover. Motivated by this, we propose GR-GIC, an efficient GIC that delivers competitive reconstruction
