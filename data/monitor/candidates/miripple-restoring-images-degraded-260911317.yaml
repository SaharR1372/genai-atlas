summary: Iterative reference-conditioned image editing can introduce grid-like and granular textures,
  commonly described as digital ripple. We present Mi-Ripple, a diagnosis-guided restoration workflow
  that suppresses this digital ripple while protecting image structure. Mi-Ripple separates periodic lattice
  artifacts from content-entangled granular texture, then combines selective spectral notching, structure-aware
  smoothing, and cleaned-reference regeneration. This separation enables low-distortion filtering when
  artifacts are spectrally isolated and visual reconstruction when filtering would erase legitimate detail.
