summary: Despite the success of foundation models in image synthesis, achieving fine-grained spatial control
  remains a significant challenge, typically requiring auxiliary structural adapters or complex inference-time
  steering. While modern vision-language (VLM) text encoders possess the latent capacity to represent
  spatial coordinates, generative models often fail to leverage this information. We demonstrate that
  the signal-to-noise ratio (SNR) distribution is a critical determinant of spatial grounding in flow-matching
  models. Using a novel synthetic benchmark of geometric primitives, we isolate structural mechanics from
