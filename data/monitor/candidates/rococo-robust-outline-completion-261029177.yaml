summary: We propose a learning-based generative model for completing curvilinear features under occlusion
  by environmental obstacles. To this end, we adopt a flow matching-based approach that supports the inpainting
  of occluded regions with the appropriate curvilinear features. To eliminate the reliance on privileged
  information about the occlusion a priori, we also train a UNet-based mask prediction model, which can
  identify regions for inpainting given only the occluded observation. The components of our approach
  are validated via experiments using procedurally-generated test cases, and the complete pipeline is
