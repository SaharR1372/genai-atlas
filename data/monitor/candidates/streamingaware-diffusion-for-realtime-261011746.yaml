summary: 'Real-time video super-resolution requires high spatio-temporal fidelity under strict latency
  constraints, challenging diffusion models due to their iterative sampling cost and limited temporal
  coordination. We propose a streaming-aware framework that adapts pretrained single-image latent diffusion
  models for efficient video super-resolution (VSR) by exploiting the sequential structure of video streams.
  Our Cross-Step Attention mechanism reuses intermediate denoising features across adjacent frames and
  diffusion steps, enabling temporal information exchange without explicit temporal modeling. We further
  introduce Trajectory-Coupled Diffusion Scheduling, which aligns adjacent diffusion states '
