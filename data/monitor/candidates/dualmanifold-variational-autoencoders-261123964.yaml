summary: 'In latent diffusion models, expanding the latent dimension of variational autoencoders (VAEs)
  is essential to push the upper bound of reconstruction quality. However, without explicit structural
  constraints, such unregularized expansion easily yields a rugged and ill-conditioned latent manifold,
  causing generated latents to drift off the manifold during generation (i.e., off-manifold problem).
  Recent works smooth this manifold by using external foundation models (e.g., DINOv2) as a topological
  regularizer. However, we argue that tying the latent space to frozen external priors inherently restricts
