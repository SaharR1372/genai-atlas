summary: 'Generative modeling approaches often focus on recovering broad statistical characteristics from
  the training data. In the context of graph generation, this may refer to degree distributions, clustering
  coefficients, or spectral properties. However, generating usable distribution feeders when detailed
  feeder models are unavailable requires more than matching generic graph statistics: the sampled topology
  must also obey electrical compatibility and radiality rules. We therefore formulate feeder synthesis
  as a constraint-guided graph generation problem and propose the Power-Grid-constrained Discrete Denoising
  Diffusion model, PG-DiGress, which learns categorical node and edge patterns from feed'
