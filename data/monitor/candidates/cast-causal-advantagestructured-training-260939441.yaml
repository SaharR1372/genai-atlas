summary: 'Online reinforcement learning has been extended to flow matching for diffusion model (DM) image
  generation. However, this paradigm faces three limitations: (1) Window selection. Existing methods manually
  set the stochastic differential equation (SDE) sampling window, i.e., the denoising steps where exploration
  noise is injected. We instead determine it from each model''s denoising trajectory. (2) Reward saturation.
  Current methods rely on scoring models trained on human annotations; we find that such scores are extremely
  high and nearly indistinguishable on the latest SOTA open-source DMs, making advantage estimation largely
  ineffective. (3) Sample inefficiency. A single scalar reward collaps'
