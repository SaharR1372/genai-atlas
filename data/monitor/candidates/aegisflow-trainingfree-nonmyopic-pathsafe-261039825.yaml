  capabilities in synthesizing high-quality data. However, steering their generative trajectories to satisfy
  strict constraints--such as identity preservation in image editing or obstacle avoidance in robotics--remains
  fundamentally challenging. While recent training-free guidance methods enforce path-safety, they rely
