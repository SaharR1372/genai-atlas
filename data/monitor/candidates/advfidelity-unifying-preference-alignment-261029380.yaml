summary: Practical image generation requires both human preference alignment and few-step efficiency,
  yet combining reinforcement learning (RL) with distillation is often multi-stage and may erode RL gains
  We observe that few-step RL progressively improves structural coherence, even with specialized rewards,
  but leaves low-level artifacts that these rewards may fail to penalize. To address this gap, we propose
  AdvFidelity, which integrates artifact-sensitive fidelity supervision into RL through an online adversarial
  reward. This enables joint reward alignment and high-fidelity few-step generation within a single RL
  stage, without distribution matching distillation (DMD) or other explicit distillation
