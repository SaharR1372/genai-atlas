summary: Single-image, multi-image, and video deep research require different visual operations but share
  a workflow of visual grounding, external retrieval, and fact composition. A key challenge is to preserve
  the dependencies linking localized visual anchors, entity relations, source-supported facts, and answer-producing
  operations. We introduce OneSearch-VL, a unified agent centered on the Visually Grounded Evidence Graph
  (VGEG), which encodes these dependencies as a shared task-level reference for data construction, process
