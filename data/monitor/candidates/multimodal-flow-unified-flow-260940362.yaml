summary: We present Multimodal Flow, a fully continuous generative model of language and vision. Most
  unified multimodal models either model both language and quantized images as discrete tokens or combine
  discrete language prediction with continuous image generation. The former introduces a visual quantization
  bottleneck. The latter requires modality-dependent objectives and sampling procedures. Fully continuous
