summary: 'Most image generation models rely on uniform tokenization, allocating the exact same computational
  budget to equally-sized image patches. This static paradigm cannot adapt to different resource constraints
  at inference time, and yields suboptimal quality-cost tradeoff by devoting the same effort to both plain
  backgrounds and intricate details. We propose BudgetPix, an adaptive tokenization framework that dynamically
  allocates compute based on visual complexity and spatial layout, enabling flexible computational budgeting
  at inference time. BudgetPix comprises three key components: (1) an adaptive encoder that maps a fixed-size
