summary: 'Autoregressive (AR) image generators are powerful in principle but inflexible in practice: training
  with a fixed raster-scan order hardcodes a single factorization of the image distribution into the model,
  leaving it unable to inpaint, outpaint, or edit at inference time. Existing solutions, including the
  modern discrete-diffusion family, train from scratch on a mixture of token orderings, paying roughly
  3x the compute of standard raster-scan training; discrete diffusion further sacrifices compatibility
  with the AR inference ecosystem (KV caching, vLLM) by construction. We argue that this cost is unnecessary.
