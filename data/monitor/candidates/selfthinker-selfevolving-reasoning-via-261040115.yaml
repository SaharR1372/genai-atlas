summary: Unified multimodal models can both generate and understand images within a single set of weights,
  offering an opportunity to use image synthesis as training supervision for visual comprehension. However,
  existing visual chain-of-thought methods rely on human-annotated helper images during training and require
  slow image generation at test time. We present SelfThinker, the first self-evolving framework that turns
  a unified model's self-generated visual thoughts into stronger understanding without human image annotations.
