summary: 'Distilling pretrained foundation models into an autoencoder bottleneck improves latent diffusability,
  enabling diffusion models to converge faster and reach higher sample quality. Standard distillation
  aligns the latent at each position to a co-located teacher feature, tying the latent layout to the teacher''s.
  We show this constraint is unnecessary: aligning a single pooled image-level descriptor to the teacher''s
  performs as well as or slightly better than dense position-wise distillation. We compare first-order
  and relational pooled objectives across latent shapes and teacher modalities. First-order matching extends
  naturally to 1D token-sequence latents and across modalities, where distill'
