summary: 'Humans routinely consume multimodal content, where textual and visual information is naturally
  interleaved. Although Unified Multimodal Models (UMMs) can jointly generate text and images, multimodal
  interleaved generation remains largely underexplored. Progress in this area is hindered by two key limitations:
  (1) the lack of well-defined interleaved generation tasks and corresponding training data, and (2) the
  absence of fine-grained evaluation protocols that can reliably diagnose model performance across different
  capability dimensions. To this end, we present IntReal, comprising two complementary components: IntReal-100K,
  a real-world dataset of multimodal interleaved samples spanning four'
