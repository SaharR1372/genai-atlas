summary: Sparse autoencoders (SAEs) reveal visual structure in diffusion transformers (DiTs), but interpreting
  a feature does not establish whether it can be used to control generation. We introduce D-Scope (Diffusion
  Scope), a framework that connects feature interpretation to generation control through shared visual
  evidence. D-Scope aggregates SigLIP~2 embeddings of highly activating image patches into visual centroids.
  Matching target text descriptions against these visual centroids in the shared image-text embedding
  space then enables retrieval of individual features without per-feature text annotations. The underlying
