summary: 'As image generation models become increasingly capable of producing highly realistic content,
  traditional forensic techniques are struggling to keep up. This paper investigates whether MLLMs can
  instead be used as a form of forensic analysis by identifying synthetic media. Specifically, the study
  aims to determine whether these models detect fake images by recognising physical inconsistencies, or
  whether they rely on digital artefacts such as embedded watermarks.Six MLLMs: GPT-4o, GPT-5, GPT-5.2,
  Gemini 2.5, Gemini 3, and Seed 1.6, are benchmarked using a dataset of 400 images. Fifty images are
  authentic photographs, while the remaining 350 are generated using seven leading image models: Gem'
