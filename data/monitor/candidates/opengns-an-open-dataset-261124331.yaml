summary: 'The Gradient Noise Scale (GNS) metric measures the signal-to-noise ratio of gradients in stochastic
  gradient descent and, as shown by McCandlish et al. (2018), can be used to approximate the Critical
  Batch Size (CBS) during neural network training. Despite its appearance in technical reports of frontier
  models, no open dataset of GNS measurements across modern architectures exists, limiting systematic
  study of the metric. We close this gap by releasing OpenGNS, a dataset of more than 400 GNS measurement
  trajectories spanning three domains: image classification with ResNets, autoregressive language modeling
