summary: 'Predictive coding (PC) trains neural networks through local energy-minimization dynamics without
  depending on a global error signal that backpropagation (BP) requires. Although PC is a promising alternative
  algorithm for efficient learning, the computational cost of inference dynamics currently outweighs the
  resulting learning benefits in practice. In this work, we take inspiration from optimization theory
  to extract more learning benefit from each inference phase. We introduce Natural PC, which augments
