summary: Multimodal Large Language Models (MLLMs) struggle with accurately capturing camera-object relations,
  especially for object orientation, camera viewpoint, and camera shots. This stems from the fact that
  existing MLLMs are trained on images with limited diverse camera-object relations and corresponding
  textual descriptions. To address this, we propose a synthetic generation pipeline to create large-scale
  3D visual instruction datasets. Our framework takes 3D assets as input and uses rendering and diffusion-based
  image generation models to create photorealistic images preserving precise camera-object relations.
