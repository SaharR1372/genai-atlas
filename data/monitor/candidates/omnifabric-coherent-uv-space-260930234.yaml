summary: Automated generation of production-ready 3D garment assets from a single image is a central challenge
  in digital content creation. While recent generative models have significantly advanced 3D geometry
  reconstruction, synthesizing high-quality textures remains a bottleneck. Existing methods often bake
  environmental illumination and shadows directly into the texture map, or they fail to maintain global
  structural coherence, making the resulting assets unusable for physical simulation and relighting. In
