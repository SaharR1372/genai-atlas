summary: Missing-sequence completion is important for comprehensive brain tumor characterization, but
  cross-modal fusion can obscure sequence-specific contrast and lose fine-grained three-dimensional tumor
  detail. To address this challenge, we introduce Modality-aware Orthogonal-axis Status-conditioned Attentive
  Integration for Completion (MOSAIC-Flow), a unified framework for missing-sequence completion that learns
  a target-conditioned velocity field while keeping the seven acquired volumes fixed throughout the transport.
