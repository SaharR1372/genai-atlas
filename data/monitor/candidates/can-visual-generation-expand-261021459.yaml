summary: 'Unified multimodal models (UMMs) receive image-generation supervision that exposes them to visual
  information not fully documented in text. Can learning to generate images expand what pretrained models
  know? We introduce Knowledge Transfer Probing (KTP), a controlled protocol that supplies new knowledge
  through image-generation training and tests its accessibility through text-only question answering.
  Across seven knowledge categories and three UMMs, we observe direct but uneven transfer from visual
  supervision to language. Motivated by these observations, we successively introduce Textual Alignment
