summary: Distinguishing different heat sources in low-resolution infrared (IR) images is inherently difficult,
  as multiple thermal emitters often collapse into ambiguous and overlapping responses. Existing super-resolution
  methods hallucinate structures from such ambiguous 2D evidence, leading to thermal drift, boundary merging,
  and unreliable restoration under infrared degradations. We propose FlowIR, a depth-driven rectified
  flow framework that resolves thermal ambiguity by injecting 3D geometric cues into the generation process.
