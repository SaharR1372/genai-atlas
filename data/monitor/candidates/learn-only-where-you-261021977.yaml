  by expressing uncertainty over empirical measurements, boundary conditions, and governing equations.
  However, they struggle to scale to larger datasets and nonlinear information. Conversely, diffusion
  models excel at learning complex distributions over functions from massive datasets, but struggle in
  scientific contexts where training data are scarce and physical or observational information must be
