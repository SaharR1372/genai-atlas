summary: 'Multimodal large language models (MLLMs) achieve strong performance on visual reasoning tasks,
  yet remain prone to hallucinations and over-reliance on language priors, often generating answers without
  adequately using task-relevant visual evidence. Existing approaches primarily improve reasoning through
  reasoning-oriented supervision or inference-time strategies. In this work, we study a complementary
  question: can multimodal reasoning be improved by strengthening implicit visual grounding without directly
  supervising the reasoning process? Motivated by the functional specialization of attention heads, we
  investigate whether reasoning can be improved by guiding only the heads most responsive'
