summary: Decoding sensory-evoked functional magnetic resonance imaging (fMRI) data is a central analytical
  tool in cognitive neuroscience. Here we ask whether self-supervised learning (SSL), which has been scarcely
  explored in this domain, can yield representations that support strong downstream performance. To do
  so, we adapt a joint embedding predictive architecture (JEPA) to train participant-specific encoders
  on brain data alone. The encoders never see the stimulus images or any representation derived from them.
