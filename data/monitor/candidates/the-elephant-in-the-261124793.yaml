summary: Visualizing intermediate representations could help us inspect the reasoning steps underlying
  a model output. Unified multimodal models offer this opportunity by combining understanding and generation
  in one architecture. Their image generators can access representations formed while processing text.
  We introduce the V-lens, which uses this connection to visualize a chosen token's hidden state without
  training a decoder. Across four diffusion-based and two purely autoregressive unified models, the resulting
  images reveal key intermediate concepts that connect a question to its answer even when the concepts
