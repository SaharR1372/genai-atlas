summary: Distribution matching distillation (DMD) has emerged as a leading paradigm for distilling diffusion
  models into few-step students, where an auxiliary fake score model tracks the student's distribution
  and the discrepancy between the teacher and fake predictions drives the student toward the teacher.
  In multi-step distillation, although only the student's final output is delivered, existing methods
  train the fake model on intermediate states or across all denoising steps. Consequently, the student's
