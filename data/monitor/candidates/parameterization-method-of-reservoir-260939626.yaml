summary: Ensemble smoothers are the most successful and efficient techniques currently available for history
  matching. However, because these methods rely on Gaussian assumptions, their performance is severely
  degraded when the prior geology is described in terms of complex facies distributions (non-Gaussian).
  In this way, for these methods, we need to apply efficient parameterization techniques. Currently, the
  most efficient methods for performing parameterization are deep learning models. However, given the
  variety of existing deep learning models, studies have not identified which is most suitable for use
  with ensemble-based methods, although some important models had already been evaluated. Based
