summary: AI-generated images often misrepresent historically marginalised communities, with real-world
  consequences beyond the images themselves. However, conventional metrics fail to measure how communities
  want to be represented in AI-generated images. To address this, we introduce the concept of preferred
  representation. Building on previous work, we propose a measurement instrument that operationalises
  this concept through a Community Scorer - a model that evaluates a specific community's preferred representation
