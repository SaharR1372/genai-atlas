summary: Flow matching has emerged as a powerful generative family for simulation-based inference (SBI).
  However, sampling and density evaluation require numerical integration at inference time. This makes
  posterior sampling in neural posterior estimation costly. More importantly, it can make repeated likelihood
  evaluation prohibitively expensive and impractical for Markov chain Monte Carlo (MCMC) sampling, which
