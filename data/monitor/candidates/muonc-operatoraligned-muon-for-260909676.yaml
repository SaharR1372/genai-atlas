summary: Muon replaces matrix momentum with an approximately orthogonal polar direction, but its geometry
  depends on the matrix representation. For convolution, standard unfolding describes a local patch map
  rather than the convolution operator. We introduce Muon-C, an operator-aligned optimizer that represents
  kernel momentum as frequency-wise channel-transfer matrices, polarizes these blocks independently, and
  uses a critical Fourier grid to return updates exactly to the original finite kernel support. We show
