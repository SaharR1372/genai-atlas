summary: 'Diffusion transformers (DiTs) have become the dominant architecture for high-fidelity image
  synthesis, yet they suffer from slow training convergence and high computational cost. Two recent lines
  of work address this from complementary angles: Representation Alignment (REPA) accelerates DiT training
  by aligning intermediate features with a pretrained external representation model (e.g., DINOv2), while
  Representation Auto-Encoders (RAE) replace the pixel-space VAE with a compact representation-space tokenizer
  learned from self-supervised features. However, these approaches are developed and applied in isolation:
  REPA still relies on a pixel-space VAE for latent diffusion, and RAE does not exp'
