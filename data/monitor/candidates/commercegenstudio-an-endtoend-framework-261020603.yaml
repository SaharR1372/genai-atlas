summary: 'We present CommerceGen-Studio, an end-to-end framework for generating commercial-grade main
  images for e-commerce Stock Keeping Units (SKUs). Our framework is organized along a three-stage pipeline
  of information extraction, semantic rewriting, and multi-condition generation: Prompt-Eval-Refine-Loop
  Agent (PERL-Agent) distills heterogeneous SKU metadata into concise selling-point text lists through
  an iterative closed loop of VLM and LLM roles scored by a reference-free rubric. Layout Thinker Optimization
  (LTO) aligns the rewriter with both caption and rendered-image quality via alternating domain-specific
  policy optimization. SKU-DiT, trained under Reinforce-Distill-Reinforce (RDR) progress'
