summary: With the growing demand for privacy-preserving and occlusion-resilient human pose recognition
  (HPR), 5G channel state information (CSI) offers a promising contactless sensing modality by integrating
  communication and sensing capabilities. However, collecting large-scale synchronized CSI-pose pairs
  remains costly in practical 5G systems. To address this limitation, we propose StructFlow-HPR, a structured
  pose-conditioned flow matching framework for generative CSI augmentation. StructFlow-HPR learns a continuous
