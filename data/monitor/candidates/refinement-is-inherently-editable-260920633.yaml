summary: 'Text-guided image editing must introduce the requested changes while preserving unrelated source
  content. Diffusion-based editors rely on spatial controls whose inaccuracies can leave edits incomplete
  or alter unrelated regions. Causal autoregressive editors face a further constraint: their fixed decoding
  order limits revision of earlier decisions. We introduce RefineEdit, a training-free prompt-to-prompt
  image editing framework built on a Generative Refinement Network. Our key idea is to couple edit localization
  with content generation through the global refinement of binary image codes, allowing editing evidence
  to be reassessed as the image evolves. RefineEdit initializes an editing branc'
