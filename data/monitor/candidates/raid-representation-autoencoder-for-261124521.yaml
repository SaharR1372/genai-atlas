summary: Single-image intrinsic decomposition is an inherently ill-posed problem, requiring the disentanglement
  of strongly coupled appearance factors from a single RGB observation. Recent methods address this ambiguity
  with diffusion priors, at the cost of large, iterative, and often stochastic models. We show that accurate
  decomposition does not require a large generative model. Our key idea is to decouple reconstruction
