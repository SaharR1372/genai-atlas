summary: 'Synthetic image and mask pairs can alleviate scarce colonoscopy annotations, but realistic synthesis
  requires preserving the supplied lesion while generating compatible mucosa. Existing foreground-guided
  methods treat all non-foreground pixels as background and rely mainly on local integration. Directly
  applying them to colonoscopy causes two problems: non-mucosal black regions contaminate generated tissue,
  and local reasoning produces inconsistent mucosal texture and illumination. We propose LAMP, the first
  foreground-guided framework for polyp image synthesis based on lesion-guided adaptive mucosal context
  propagation. LAMP explicitly separates the lesion, valid mucosa, and camera exterior'
