summary: Diffusion models have become the leading paradigm in generative modeling, yet many applications
  require sampling from distributions that are not those of any single pretrained model, but are instead
  defined through combinations of several models, possibly tilted toward high values of a downstream reward.
  Naively combining the scores of the models yields incorrect samples, while existing corrections are
  restricted to specific families of targets. In this work, we introduce the generalized Feynman-Kac correctors
