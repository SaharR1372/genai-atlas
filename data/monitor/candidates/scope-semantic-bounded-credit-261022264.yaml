summary: Reinforcement learning (RL) enables language models to improve text-to-image (T2I) generation
  by rewriting prompts for a frozen image generator. Existing methods typically apply a single signal
  derived from the image to individual subword tokens, although objects, counts, attributes, and relations
  form coherent semantic spans. We propose SCOPE, an objective based on Group Relative Policy Optimization
  (GRPO) that aligns update weighting with this structure. The rewriter jointly generates an enhanced
