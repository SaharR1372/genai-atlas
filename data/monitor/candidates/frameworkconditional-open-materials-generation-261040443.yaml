summary: Theoretical predictions of novel materials rely on a variety of techniques, from data-mining-based
  ion substitution methods to fully de novo generative models. Each approach imposes specific constraints
  and encounters unique challenges when extrapolating beyond the distribution of known materials to discover
  new ones. The foremost goal of materials generation is to produce stable, unique, and novel (S.U.N.)
  structures. Predicted structures that meet these criteria, however, typically result from novel chemical
  compositions mapped onto known structural prototypes or frameworks. We leverage this heuristic insight
  to present a new generative paradigm for the de novo prediction of inorganic crys
