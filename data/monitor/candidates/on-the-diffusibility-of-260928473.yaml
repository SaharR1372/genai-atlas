  pretrained visual encoders. However, many off-the-shelf encoders are not optimized for faithful reconstruction,
  discarding fine-grained visual details. As expected, finetuning these encoders for image reconstruction
  recovers such details. However, perhaps counterintuitively, this procedure reduces the effective dimensionality
