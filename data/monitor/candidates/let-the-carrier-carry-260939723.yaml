summary: 'Strong unrestricted adversarial attacks can distort the primary object of an image, hereafter
  referred to as the subject. To preserve subject integrity without compromising attack magnitude, we
  introduce the carrier: a secondary visual element that provides an auxiliary region to facilitate the
  attack under global classifier guidance. We demonstrate three key findings: 1. A carrier mitigates subject
  distortion by absorbing a larger share of globally normalized attack updates. 2. A carrier improves
  cross-model transferability, governed by the strength of target-related features that balance semantic
