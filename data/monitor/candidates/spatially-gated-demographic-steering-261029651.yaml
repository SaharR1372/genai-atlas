summary: 'Text-to-Image models reproduce societal stereotypes, and existing mitigation applies one demographic
  correction to the whole scene. In multi-person scene generation this creates a trade-off: global steering
  improves aggregate balance only by homogenizing the people within an image. Steering-based methods like
  Embedding Arithmetic drive the intra-image diversity below the unsteered baseline. Text- and latent-projection
  approaches shift the aggregate skew with only marginal gains in intra-image diversity. We present Spatially
  Gated Steering (SGS), which steers the demographics of each person independently by extracting per-person
  masks from the Diffusion Transformer''s (DiT) internal attention '
