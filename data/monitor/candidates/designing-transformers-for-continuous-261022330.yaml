summary: Continuous diffusion language models (CDLMs) offer an alternative approach to parallel language
  generation; however, most existing studies directly use transformer architectures from either causal
  large language models (LLMs) or Diffusion Transformers (DiTs) for image generation, which were not optimized
  for CDLMs. In this paper, we conduct a systematic study on Transformer architectures for CDLMs and introduce
  Language Diffusion Transformer (LangDiT), combining feature and query-key normalization, wider noise
  conditioning, likelihood-shortcut gradient routing and calibration, and confidence-gated training self-conditioning.
  LangDiT significantly reduces generation perplexity in matched Lang
