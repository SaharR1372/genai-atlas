summary: 'The marginals of a continuous diffusion model can be reproduced by a deterministic ordinary
  differential equation (ODE), known as the probability flow ODE, which provides a foundation for accelerated
  sampling and consistency distillation. In this paper we address the question whether an analogous formulation
  exists for discrete diffusion models and answer it affirmatively by introducing exponential residual
  flows (ERFs). Our framework augments the discrete state with a continuous residual variable for each
  token and position. These residuals evolve deterministically according to piecewise-defined ODEs whose
  vector fields depend on the current discrete state and the forward and backward rate '
