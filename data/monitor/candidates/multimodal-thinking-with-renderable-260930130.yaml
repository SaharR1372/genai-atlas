summary: Current vision-language models (VLMs) excel at visual content understanding and text-based reasoning,
  yet their structure limits the advancement of incorporating images into the reasoning chain. Though
  Omnimodal models have made efforts in unifying text and image generation, they focus on visual tasks
  in the open-domain, lacking tractability due to rasterized or latent representations of images. We introduce
  SVGLM, a framework that uses scalable vector graphics (SVG) primitives to connect text and image in
