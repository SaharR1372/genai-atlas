summary: 'Co-denoising pretrained representations such as DINO can substantially improve the training
  speed and quality of flow matching models, but it introduces a second denoising trajectory and requires
  carefully designed schedules. We propose a simpler alternative: predict the pretrained representation
  directly, then condition the model on its own prediction. This removes the need for a second ODE and
  any representation-specific denoising schedules, while retaining the benefits of representation guidance.
  Our approach converges substantially faster and achieves better generation quality as measured by FID
  score. On ImageNet, it outperforms the state of the art in latent space at 2x fewer epochs th'
