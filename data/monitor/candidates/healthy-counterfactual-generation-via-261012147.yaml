summary: False negatives remain a critical limitation of computer-aided diagnosis (CAD) systems for breast
  cancer screening due to delayed detection and treatment. To address this issue, we propose a counterfactual
  data augmentation strategy that generates healthy mammograms by "erasing" lesions from anomalous images,
  thereby enriching the training distribution. We train a Denoising Diffusion Probabilistic Model on BI-RADS
  1 (healthy) mammograms and use a RePaint-based sampling strategy to inpaint realistic normal tissue
