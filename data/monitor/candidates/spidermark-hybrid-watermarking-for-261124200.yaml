summary: The proliferation of diffusion-based generative models has intensified the need for reliable
  methods to trace and verify the provenance of AI-generated images. Existing watermarking approaches
  for diffusion models typically rely on isotropic frequency patterns and handcrafted detection metrics,
  which are prone to directional vulnerability and threshold instability across diverse image transformations.
