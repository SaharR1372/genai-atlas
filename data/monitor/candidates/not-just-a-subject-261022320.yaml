summary: Recent advancements in diffusion models have significantly improved text-to-image generation,
  enabling their application to visual storytelling, where coherent image sequences are generated from
  narrative prompts. However, existing methods primarily focus on identity preservation and often fail
  to adapt to diverse scene variations, resulting in semantic misalignment and structural inflexibility.
  We propose EOS-Story, a training-free framework that harmonizes identity consistency with scene-specific
