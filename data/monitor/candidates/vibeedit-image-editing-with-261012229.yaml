summary: In text-guided image editing, describing the desired change is often straightforward, but identifying
  the intended object or region can be cumbersome, especially when several objects look alike. We introduce
  a new image editing interface that lets users place spatial marks and optional short notes directly
  on the image. Together, these annotations form a canvas instruction that specifies where to edit and
  what to change. Our editor, VibeEdit, follows these instructions to perform object addition, removal,
  replacement, attribute modification, and movement without a separate text prompt. We construct 1.55
