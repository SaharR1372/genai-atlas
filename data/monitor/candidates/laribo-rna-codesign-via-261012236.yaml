summary: RNA function arises from the coupling of nucleotide sequence and three-dimensional structure,
  motivating their joint design. Coordinating global folding with nucleotide-level detail remains challenging
  under limited structural supervision. We introduce La-Ribo, a generative framework for RNA sequence-structure
  co-design via geometry-latent flow matching. La-Ribo retains a sparse phosphate-sugar--base scaffold
  and encodes nucleotide identity and local conformation in residue-wise latents. A shared flow network
  generates both jointly, and an RNA-specific decoder then reconstructs all heavy atoms. To expand supervision,
