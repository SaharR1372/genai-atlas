summary: Token merging has emerged as an effective training-free strategy for accelerating diffusion models
  by reducing redundant token computation while minimizing generation degradation. A key challenge is
  determining which tokens can be safely merged and which should be preserved for subsequent computation.
  Existing method addresses this by preserving prompt-aligned foreground regions, thereby protecting semantically
  relevant structures. However, this text-relevance criterion overlooks background objects, local details
  that are not explicitly mentioned in the prompt, leading to degraded structural coherence. In this work,
