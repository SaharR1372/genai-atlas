summary: Backdoor attacks pose a serious threat to the secure deployment of text-to-image (T2I) diffusion
  models. Existing defenses typically detect backdoors from specific abnormal patterns in internal representations,
  which may limit their generalizability with the emergence of increasingly diverse attack mechanisms.
  In this paper, we study backdoor defense of T2I diffusion models from a transition-dynamics perspective.
  We observe that benign diffusion trajectories exhibit structured and timestep-dependent transition patterns
  from cross-attention, latent and noise spaces, whereas backdoor attacks tend to induce deviations from
