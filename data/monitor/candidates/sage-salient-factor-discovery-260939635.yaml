summary: Given a target dataset, such as faces with eyeglasses, and a background dataset, such as faces
  without, contrastive analysis separates \textit{salient} factors specific to the target from \textit{common}
  content shared by both. We aim for salient representations that capture target-specific detail in each
  image, such as the shape, color, and position of the glasses, so that they reveal subtypes without subtype
  labels and guide the generation of new examples of a discovered subtype, even one with no name or text
  description. We introduce SAGE, which learns both factors directly in the high-dimensional spatial latent
  of a frozen representation autoencoder and conditions a diffusion transformer
