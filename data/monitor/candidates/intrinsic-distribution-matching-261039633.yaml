summary: One-step and few-step text-to-image generation must accurately render the details specified in
  the prompt despite limited opportunities for refinement. Distribution matching distillation (DMD) uses
  score differences to bring the generated distribution closer to a reference distribution. Following
  prior work, we estimate this difference with internal velocity branches, avoiding a separate fake-score
  network. We ask whether an explicit moment constraint improves this learned score supervision. A decomposition
  of the reverse-KL field into a Gaussian moment component and a non-Gaussian residual identifies statistics
  that can be constrained explicitly. We introduce Intrinsic Distribution Matching
