summary: 'Improving text-to-image models has traditionally relied on increasing model size or the number
  of denoising steps. In this work, we explore an alternative way to scale computation by repeatedly running
  shared Transformer blocks within each denoising step, effectively increasing computational depth while
  keeping the parameter count fixed. This looped computation enables iterative refinement of internal
  representations without explicit reasoning tokens. However, naive looping fails to consistently improve
  image quality. We trace this problem to weak supervision across intermediate loops and unregulated attention
  updates that progressively erode local information. To overcome these challenges, '
