summary: Accurate localization of neonatal hypoxic--ischemic encephalopathy (HIE) lesions on apparent
  diffusion coefficient (ADC) images is clinically important but is limited by scarce expert annotations
  and substantial variation in lesion appearance. We propose OpenMAP-HIE, a pathology-informed score-based
  diffusion model for unsupervised HIE lesion localization without voxel-wise lesion supervision. A denoising
  diffusion model learns the healthy neonatal ADC distribution, while a ControlNet-based conditional branch
  preserves patient-specific anatomy. At inference, anomaly evidence is derived directly from differences
  between conditional and unconditioned noise predictions at independently evaluate
