summary: Smart wearable devices, such as augmented reality glasses, increasingly rely on cameras to understand
  and interact with their surroundings. However, their compact sensors often capture noisy RAW images,
  while limited compute and power make high-quality on-device restoration difficult. This creates an emerging
  need to reduce both local computation and transmission cost without sacrificing image quality. Two common
  solutions are to offload restoration or to compress the raw data before transmission. The first makes
  RAW transmission costly; the second reduces the payload but can spend bitrate preserving sensor noise.
  We address this fundamental mismatch with an asymmetric framework for joint RA
