summary: One-step generative models enable fast text-guided image editing, yet they often introduce unintended
  changes to regions that should remain unchanged. Temporal aggregation stabilizes editing fields across
  noise levels, but leaves their spatial allocation insensitive to local variations in reliability. Consequently,
  temporal stability alone does not ensure spatially consistent editing. To address this lim- itation,
  we propose ER-Chord, a training-free and inversion-free framework for reliability-guided spatial redistribution.
