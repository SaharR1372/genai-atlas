summary: 'People often understand the world by comparing different views of it. Vision-language models
  (VLMs), however, receive these views as separate images and still struggle to relate them. One problem
  is data. Training on these tasks requires groups of images with a known relationship: the same object
  from different viewpoints, or the same scene before and after a change. Such examples are hard to collect
  at scale from existing photo collections. We introduce ReSynth, which turns single-image perception
  and controllable image generation into cross-image relational supervision. Localized editing produces
  before-and-after pairs, viewpoint generation produces multiple views of the same instance, and'
