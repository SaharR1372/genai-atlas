summary: Learning across medical imaging modalities requires making use of images without paired text
  and accommodating new domains while retaining existing representations. We propose a medical vision-language
  technique built around an expandable bank of modality experts. Its Multiway Transformer combines shared
  visual computation with deterministically routed feed-forward experts and a separate text pathway. A
  modality-aware visual tokenizer supplies targets for masked pretraining on 19.4 million unpaired image
