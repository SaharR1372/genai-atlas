summary: Recent work suggests that pretrained image generators encode real-world understanding beyond
  image synthesis. Vision Banana exploits this by framing vision tasks as conditional image editing. However,
  its data, weights, code, and implementation details are not public. We present Open Vision Banana (OVB),
  a fully open and reproducible recipe for converting pretrained generators into unified multi-task perception
  systems. Our analyses identify the design choices that matter most for generalization, including color
  encoding, prompt design, parameter adaptation, and task balancing. These choices interact, so individually
  helpful choices can hurt when combined with others. Starting from 4B and 9B
