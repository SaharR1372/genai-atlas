summary: Single-image HDR reconstruction requires inferring missing detail while preserving the visible
  content of an LDR image. Differences in sensor dynamic range and exposure cause LDR images to lose varying
  amounts of information in shadows and highlights. We present ExpandDiff, a conditional diffusion pipeline
  that jointly reconstructs clipped shadows and highlights. To account for this variation, we introduce
  Dynamic Clipping Synthesis (DCS), which randomly samples shadow and highlight clipping percentiles when
