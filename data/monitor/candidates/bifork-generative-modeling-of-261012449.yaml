summary: Bifurcations are ubiquitous in physical systems, from structural buckling to fluid and climate
  dynamics, yet they remain largely unexplored in deep learning. At a symmetry-breaking bifurcation, a
  single input admits multiple equally valid solutions, violating the one-to-one assumption underlying
  most learned physical surrogates. We introduce Bi-FORK, a generative framework for learning these one-to-many
  solution maps in high-dimensional systems. Bi-FORK generates complete trajectories through latent flow
