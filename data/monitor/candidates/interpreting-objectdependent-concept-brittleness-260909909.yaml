summary: Although text-to-image diffusion models generally exhibit strong prompt-following ability, we
  identify a persistent and previously underexplored failure pattern in which a small subset of prompts
  differing only in the object consistently fails to realize the same target concept under identical generation
  settings. We term this phenomenon object-dependent concept brittleness. Such cases suggest systematic
  internal blind spots rather than random sampling noise. In this paper, we present an interpretability-oriented
  framework to audit and minimally correct these failures. Our key idea is to analyze denoising trajectories
