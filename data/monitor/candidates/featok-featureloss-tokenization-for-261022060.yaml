summary: Discrete image generators learn the distribution of tokens produced by an image tokenizer. These
  token representations should be easy for generators to model, not merely enable faithful image reconstruction.
  Yet these tokenizers are commonly trained to reconstruct pixels, which prioritizes low-level fidelity
  and may disrupt representation structure useful for generation. Motivated by feature-predictive self-supervised
  learning, we introduce feature-loss tokenization (FeaTok), which trains discrete tokens by reconstructing
  pretrained features rather than pixels. Ablations across SigLIP, SigLIP2, DINOv2, and DINOv3 show better
  generative performance with FeaTok. In class-conditional generation
