summary: 'Strong guidance in text-to-image (T2I) diffusion models concentrates sampling toward high-density
  modes of the conditional distribution, collapsing independently sampled noise vectors onto nearly identical
  visual prototypes. This limits utility for tasks that demand distributional breadth, most critically
  synthetic data augmentation. Diversity, however, is a collective property of the whole batch: a set
  can preserve every pairwise distance yet still collapse onto a low-dimensional subspace. Existing sum-of-pairwise
