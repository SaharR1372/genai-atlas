summary: Flow matching has emerged as a scalable paradigm for training high-quality generative models,
  but sampling from the learned probability flow requires many network evaluations. Distillation can reduce
  this cost to one or a few evaluations; however, one-step generation often sacrifices quality, making
  few-step generation the practical operating regime. Existing few-step methods perform their iterative
  computation along the probability flow and therefore require a fixed, manually chosen timestep discretization.
