summary: 'Distribution Matching Distillation (DMD) distills multi-step diffusion models into few-step
  generators by minimizing reverse KL divergence. Despite its strong performance, DMD guides samples by
  local density alone, which introduces two limitations: teacher scores can be unreliable in regions of
  low teacher density, and the mode-seeking behavior of reverse KL can collapse the student onto a subset
  of the teacher modes. We first connect DMD to Wasserstein gradient flow, showing that its gradient follows
  from a fixed-point formulation with integral KL (IKL) as the energy functional. This perspective motivates
  augmenting IKL with an optimal transport term that addresses these limitations by guid'
