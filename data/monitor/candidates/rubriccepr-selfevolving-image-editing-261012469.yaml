summary: 'Instruction-guided image editors have become highly capable, yet improving them further still
  depends on human-edited training pairs or external reward models. Such supervision is costly to obtain
  and can reward plausible failures: a realistic output may leave the requested change undone or alter
  content that should be preserved. In this work, we strive to improve a pretrained image editor using
  only its own generations, without human-edited targets or an external training-time reward model. To
  this end, we propose a self-evolving framework, named Rubric-CEPR, that verifies the editor''s own samples
  with its internal representations through a rubric-augmented Contrastive Edit-Preservation Rew'
