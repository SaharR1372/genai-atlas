summary: We propose DINO-FIL, a transformer-based framework for pixel-level localization of generative
  image forgeries. The method leverages multi-layer representations from a pretrained DINOv3 ViT-H+/16
  encoder combined with a lightweight fusion decoder to capture both semantic structure and fine-grained
  texture inconsistencies introduced by image editing. By aggregating intermediate transformer features
  across depths, the model improves sensitivity to subtle, spatially localized artifacts that are often
  missed by standard single-layer approaches. We evaluate DINO-FIL in a cross-dataset setting, training
