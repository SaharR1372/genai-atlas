summary: Fairness auditing of text-to-image diffusion models often requires generating large numbers of
  images across sampling configurations, making comprehensive evaluation computationally expensive. We
  propose a causal-abstraction-based audit instrument for efficiently evaluating fairness under interventions
  on the classifier-free guidance scale. Given a fixed prompt and a target feature function, we represent
  the diffusion process as a low-level structural causal model and construct a corresponding high-level
