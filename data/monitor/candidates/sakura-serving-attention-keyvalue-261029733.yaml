summary: Diffusion transformers are widely used in image-editing services. To preserve both efficiency
  and privacy, existing systems commonly rely on cloud-device collaboration. Keeping request-specific
  inference on the device avoids sending personal images and prompts to the cloud. These workloads often
  use common templates, such as in face swapping and virtual try-on, enabling KV state to be precomputed
  and reused across requests. However, this reusable state is large and scales with the number of templates,
  making it impractical to store all of them on mobile devices. Storing them in the cloud addresses this
