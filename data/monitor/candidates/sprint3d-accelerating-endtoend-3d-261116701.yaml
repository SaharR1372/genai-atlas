summary: 'Image-to-3D generative models now produce asset-quality textured meshes, but at minutes per
  asset they remain slow to iterate with and costly to deploy. Prior work has mostly accelerated the sampling
  of the networks, and where it also optimizes the mesh processing, it trains its own generators. We instead
  start from a publicly released pipeline and ask how much of its end-to-end time can be saved. Profiling
  the public Pixal3D pipeline shows that its latency is dominated by what happens after the networks:
