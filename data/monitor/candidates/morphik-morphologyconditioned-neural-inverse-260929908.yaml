summary: Neural models can learn to generate various solutions to the inverse kinematics problem from
  data, but are usually limited to a single robot. We present MorphIK, a flow-matching model that solves
  inverse kinematics for revolute-joint-based kinematic chains it has never seen during training. The
  model uses a transformer architecture to encode the robot's morphology along with the target pose. This
  encoding then conditions a flow-matching head that generates poses from noise. Trained on purely synthetic
