summary: Modern multimodal models bring generation and understanding into a single unified system, which
  enables them to provide and learn from their own feedback. Motivated by this unified capacity, we introduce
  UniEvo-VL, a self-evolving framework for multimodal models to learn from this constructive self-correction
  feedback during test-time compute. Instead of relying on a separate, often larger, teacher, we leverage
  their self-critiques as privileged information and ask a single multimodal model to act as both teacher
