summary: 'Diffusion and flow models generate a sample over iterative steps, each a full pass through a
  large network, and that pass dominates generation cost. Training-free caching accelerates them by reusing
  activations from recent evaluations instead of recomputing them. Dynamic caching methods decide when
  to refresh by accumulating a cheap probe of the network input into a staleness signal and spending a
  fresh evaluation once it crosses a threshold. They perform hard caching: the signal is a binary switch
  between refresh and reuse, and every step, fresh or cached, advances by the prescribed step size. We
  observe that the signal carries much more than this switch. How far it sits below the threshold'
