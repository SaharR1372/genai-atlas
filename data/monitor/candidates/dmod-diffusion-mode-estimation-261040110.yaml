summary: Diffusion models are powerful priors for accelerated MRI reconstruction, but most current methods
  are posterior samplers, which return a random draw from the posterior. A reproducible and high-quality
  reconstruction often requires averaging many samples, resulting in a high computational cost. We introduce
  D-MOD, a fast algorithm that instead provides a posterior mode. It uses a minorize-maximize algorithm
  on a lower bound of the smoothed log-posterior, which provably increases the objective. Each iteration
