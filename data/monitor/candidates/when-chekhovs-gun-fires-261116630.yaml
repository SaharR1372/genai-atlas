summary: 'In text-to-image generation, a target that the prompt mentions often appears in the generated
  image in a way the prompt does not call for. We call this failure over-realization. Mental-spaces theory
  points to the situations where it can happen: under a negation, inside what a character believes or
  imagines, as the vehicle of a figurative comparison, or behind a viewpoint that hides the target. Prior
  work has studied only negation in depth, and the conventional alignment and preference metrics do not
  penalize the failure. We build OverReal to measure it: OverReal-Gen, 698 prompts covering the four situations,
  on which we measure each generator''s over-realization rate; and OverReal-Det, 2,841 '
