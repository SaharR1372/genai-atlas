summary: 'Progressive autoregressive image codecs provide an appealing paradigm for generative compression
  by quantizing continuous latents into discrete tokens, transmitting coarse-to-fine prefix tokens and
  generating the remaining suffix tokens at the decoder. However, their reconstruction quality is fundamentally
  limited by two residuals introduced along this pipeline: the quantization residual, arising from information
  loss during discrete tokenization, and the generation residual, resulting from imperfect autoregressive
  generation of the suffix tokens. To address these limitations, we introduce ResARC, a residual-aware
  autoregressive codec that explicitly compensates for both residuals at the dec'
