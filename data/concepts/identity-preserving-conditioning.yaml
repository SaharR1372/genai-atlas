id: identity-preserving-conditioning
type: concept
name: Identity-preserving face conditioning
axis: conditioning
one_line: Combine a semantic face-embedding branch (from a face-recognition encoder) with a spatial landmark/structure
  branch, injected through some mix of decoupled cross-attention and adapter-style side networks, to preserve
  a specific person's identity across generations without per-identity fine-tuning.
