id: line-continuous-tokens
type: line
name: Continuous-token autoregression
one_line: Autoregress over continuous vectors, scoring each with a small diffusion head instead of a softmax
  over a codebook.
core_bet: Autoregression is worth keeping but quantization is not; per-token continuous prediction removes
  the codebook entirely.
primary_axis: representation
status: ascendant
since: 2023-12
sections:
- generation
- unified
arc:
- paper: givt-2023
  role: precursor
  note: Drops the codebook with a Gaussian-mixture head rather than a diffusion loss, predating MAR with
    the same underlying objection to quantisation.
- paper: mar-2024
  role: origin
  note: Shows vector quantisation is unnecessary by scoring continuous tokens with a small per-token diffusion
    loss.
- paper: transfusion-2024
  role: improvement
  note: Runs the same per-token diffusion loss on continuous image tokens inside a transformer that also
    does next-token text prediction.
- paper: fluid-2024
  role: scaling
  note: Scales the recipe to text-to-image and finds continuous tokens beat discrete ones as models grow,
    with random generation order.
- paper: resurrect-mar-2025
  role: evidence
  note: Isolates the tokenizer and bidirectional architecture, not the objective, as what actually limits
    masked autoregressive models.
- paper: nextstep1-2025
  role: scaling
  note: A 14B model with a flow-matching head reaching state of the art among autoregressive text-to-image
    systems.
strengths:
- No quantization loss, so no reconstruction ceiling from the codebook
- Keeps autoregression's flexible generation order and language-model compatibility
- Scaling evidence now exists at frontier text-to-image size
weaknesses:
- Per-token diffusion head adds sampling cost
- Still sequential, so slower than parallel denoising at comparable quality
competes_with:
- line-discrete-tokens
- line-flow-matching
- line-transition-matching
explains: null
