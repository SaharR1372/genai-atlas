id: line-medical-counterfactual
type: line
name: 'Medical: causal counterfactuals'
one_line: Generate counterfactual images through an explicit causal model, not a conditional generator.
core_bet: A medically meaningful 'what if this patient were older' requires causal machinery, and conditional
  generation alone does not provide it.
primary_axis: objective
status: ascendant
since: 2020-06
sections:
- medical
arc:
- paper: dscm-2020
  role: origin
  note: Normalizing flows and variational inference give the tractable invertibility that abduction, action
    and prediction counterfactuals need.
- paper: singla-2022
  role: challenge
  note: A GAN counterfactual explainer with no causal model at all, and the only paper in this line validated
    by a reader study with radiology residents. Counterfactual explanation was the only style that significantly
    improved their understanding of the classifier.
- paper: diff-scm-2022
  role: precursor
  note: Brings diffusion into the causal counterfactual family, via forward diffusion for abduction and
    anti-causal gradient guidance for prediction. Experiments are MNIST and ImageNet only, so it is a
    methodological bridge rather than clinical evidence.
- paper: ribeiro-2023
  role: improvement
  note: The direct successor to the origin paper, and the reference for evaluating counterfactuals against
    causal axioms (effectiveness, composition) instead of distribution distance.
- paper: shortcut-cf-2023
  role: challenge
  note: Classifier-guided diffusion, no causal model, used to find and quantify shortcut features like
    pacemakers across two chest X-ray datasets.
- paper: stylex-med-2024
  role: challenge
  note: States outright that it is not designed to infer causality, then produces clinically useful counterfactual
    attribute discovery across eight tasks, expert-panel validated.
- paper: diffchest-2024
  role: challenge
  note: 515,704 radiographs from 194,956 patients, high inter-reader agreement, patient-specific confounder
    counterfactuals, and no causal graph anywhere. The largest-scale evidence here is evidence against
    the line's own bet.
- paper: causal-adapter-2025
  role: improvement
  note: Puts structural-causal-model interventions inside a frozen text-to-image diffusion model, on ADNI
    brain MRI, scored on effectiveness, composition, realism and minimality.
- paper: pcgm-2025
  role: evidence
  note: An explicit causal graph plus voxel-level anatomical constraints for 3D brain MRI, whose counterfactual-derived
    measurements reproduce known disease effects from the neuroscience literature.
strengths:
- Answers a question conditional generators cannot even pose
- Evaluated against causal axioms rather than distribution distance
- Directly relevant to fairness and treatment-effect questions
weaknesses:
- Requires an explicit causal graph, which is hard to specify for imaging
- Sample quality lags behind mainstream diffusion
- 'The strongest clinical evidence in this area comes from work that uses no causal machinery at all:
  a radiologist reading study, a 194,956-patient cohort, and an expert-panel study, none of which build
  a structural causal model. The causal papers are evaluated on axioms; the non-causal ones on clinicians.
  That asymmetry is the line''s central unresolved problem'
explains: null
