  role: origin
  note: Formulates the unification and reports a fully causal variant matching or beating flow-based methods
    on text-to-image.
strengths:
- Offers a single formalism where the field currently has two separate camps
- From the group that introduced flow matching, so the theoretical framing is credible
weaknesses:
