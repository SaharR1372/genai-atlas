id: line-transition-matching
type: line
name: Transition matching
one_line: Model generation as discrete-time Markov transitions over a continuous state, unifying flow
  matching and continuous-token autoregression.
core_bet: Flow matching and autoregression are not rival paradigms but two settings of one transition-kernel
  formulation.
primary_axis: objective
status: emerging
since: 2025-06
sections:
- generation
arc:
- paper: transition-matching-2025
  role: origin
  note: Recasts generation as discrete-time Markov transitions over a continuous state, unifying flow
    matching and continuous-token autoregression.
- paper: tm-demystify-2025
  role: evidence
  note: Independent proof that transition matching achieves strictly lower KL divergence than flow matching
    at finite step counts.
- paper: tm-design-space-2025
  role: improvement
  note: Sweeps the head design across 56 models at 1.7B scale to find which configurations actually work.
- paper: tm-distill-2026
  role: improvement
  note: Extends transition matching to distilling video generation. Its own ablation shows plain TM pretraining
    nearly matches the full TM-MeanFlow objective, and it claims only the narrow video result, not a general
    validation of the paradigm.
strengths:
- Offers a single formalism where the field currently has two separate camps
- From the group that introduced flow matching, so the theoretical framing is credible
weaknesses:
- One paper deep; no independent replication yet
- Unclear whether the unification yields practical gains or mainly conceptual clarity
competes_with:
- line-flow-matching
- line-continuous-tokens
explains: null
