id: text-conditioning-evolution
type: transition
title: From UNet cross-attention to native multimodal conditioning
from_option: cross-attention
to_option: joint-attention
era: 2022-2026
driver: conditioning
cost: Each move traded a cheaper, more modular mechanism for a more expensive or more entangled one. Joint/MM-DiT
  attention runs full self-attention over the combined text+image sequence rather than a separate lightweight
  cross-attention module, so cost grows with (text+image) tokens squared instead of image tokens squared
  plus a linear cross-attention term. Query-bridge and native-token approaches both pull a second large
  pretrained model (an MLLM) directly into the conditioning path, so the generator now inherits that model's
  own failure modes (hallucination, instruction-following gaps) as part of how it is conditioned, not
  just what it is conditioned on.
