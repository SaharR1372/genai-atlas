summary: Bridges a frozen, understanding-only multimodal LLM to a diffusion image decoder with a small
  set of learnable query tokens, so the MLLM's weights (and its reasoning/understanding ability) never
  have to change to gain generation. Trains only on paired image-caption data with a standard diffusion
  loss.
