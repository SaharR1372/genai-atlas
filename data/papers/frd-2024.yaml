summary: Argues that evaluating medical generative models with ImageNet-derived perceptual features, the
  same family Stable Diffusion's VAE and standard FID come from, misses clinically relevant structure.
  Radiomics-native features detect distribution shift at 0.94 AUC where ImageNet features reach only 0.79
  — indirect but concrete evidence that natural-image representations are a poor fit for anatomy.
explanation: null
abstract: Determining whether two sets of images belong to the same or different distributions or domains
  is a crucial task in modern medical image analysis and deep learning; for example, to evaluate the output
  quality of image generative models. Currently, metrics used for this task either rely on the (potentially
  biased) choice of some downstream task, such as segmentation, or adopt task-independent perceptual metrics
  (e.g., Fréchet Inception Distance/FID) from natural imaging, which we show insufficiently capture anatomical
  features. To this end, we introduce a new perceptual metric tailored for medical images, FRD (Fréchet
  Radiomic Distance), which utilizes standardized, clinically meaningful, and interpretable image features.
  We show that FRD is superior to other image distribution metrics for a range of medical imaging applications,
  including out-of-domain (OOD) detection, the evaluation of image-to-image translation (by correlating
  more with downstream task performance as well as anatomical consistency and realism), and the evaluation
  of unconditional image generation. Moreover, FRD offers additional benefits such as stability and computational
  efficiency at low sample sizes, sensitivity to image corruptions and adversarial attacks, feature interpretability,
  and correlation with radiologist-perceived image quality. Additionally, we address key gaps in the literature
  by presenting an extensive framework for the multifaceted evaluation of image similarity metrics in
  medical imaging -- including the first large-scale comparative study of generative models for medical
  image translation -- and release an accessible codebase to facilitate future research. Our results are
  supported by thorough experiments spanning a variety of datasets, modalities, and downstream tasks,
  highlighting the broad potential of FRD for medical image analysis.
