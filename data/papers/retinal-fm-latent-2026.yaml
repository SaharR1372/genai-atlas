summary: 'Tests four retinal foundation models as generative latent spaces and reports the cautionary
  result the representation-latent line most needs: generation inside a foundation model''s space beats
  conventional latent diffusion when scored by that same foundation model, but the advantage largely disappears
  under classifiers trained on real images. The paper names this a synthetic-to-real representation gap.'
