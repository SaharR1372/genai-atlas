summary: 'From a single face photo, preserves identity in seconds with no per-identity fine-tuning by
  imposing "strong semantic and weak spatial conditions" through a novel IdentityNet: facial embedding
  and landmark images are integrated with the text prompt to steer generation, plugging into existing
  pretrained checkpoints (SD1.5, SDXL) as an adapter.'
