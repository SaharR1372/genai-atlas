summary: Content-aware variable patch size, cutting 70 percent of FLOPs and 83 percent of tokens for a
  1.0 point loss on DPG-Bench. Relevant because compute scaling with resolution is the standing objection
  to this whole line.
explanation: null
abstract: Pixel-space diffusion models avoid the reconstruction ceiling of latent diffusion models by
  generating directly in image space. However, their substantially higher token count makes generation
  expensive due to the quadratic complexity of self-attention. Several existing efficiency methods reduce
  this cost by using larger patches at selected denoising steps, thereby representing the image with fewer
  tokens. Yet, each step still uses a single patch size uniformly across the entire image, overlooking
  that different regions suffer different fidelity losses when coarsened. We introduce MOSAIK, a damage-guided
  framework that varies patch size across regions and denoising steps. MOSAIK adapts the PixelDiT backbone
  to generate arbitrary heterogeneous patch layouts, and a lightweight predictor uses intermediate denoising
  features to estimate the fidelity loss caused by coarsening each region. Given a token budget, our damage-guided
  layout predictor assigns fine patches to sensitive regions and coarse patches elsewhere. Remarkably,
  while reducing FLOPs by 70% and token count by 83%, MOSAIK matches the full-compute PixelDiT on GenEval
  and its DPG-Bench score drops by only 1.0 point. Compared to diverse efficiency paradigms, including
  temporal patch scheduling and feature caching, our approach delivers highly competitive performance
  at moderate budgets and consistently outperforms these baselines in highly constrained compute regimes.
