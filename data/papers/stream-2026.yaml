summary: 'The first genuine representation-space generator in medical imaging: it runs Riemannian flow
  matching directly inside a pretrained histopathology foundation model''s patch-token feature space,
  which is L2-normalized and therefore lives on a hypersphere, with a custom anisotropic decoder back
  to pixels. Its stated motivation mirrors RAE''s: conditioning on foundation features (as PixCell does)
  causes conditioning collapse, and using that space as the generative substrate is proposed as the fix.'
