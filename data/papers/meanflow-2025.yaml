summary: Replaces flow matching's instantaneous velocity target with an *average* velocity over a finite
  interval, giving a self-contained identity that supports one-step sampling trained from scratch with
  no distillation and no pretrained teacher. Reaches 3.43 FID at 1 NFE on ImageNet 256, and anchors the
  whole natively-few-step family that follows.
