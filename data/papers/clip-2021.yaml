summary: 'Trains an image encoder and a text encoder jointly with a contrastive objective on 400M
  (image, text) pairs. Predates this atlas''s 2023-2026 window and is not a diffusion paper, but its
  text tower became the first widely used prompt-embedding source for text-to-image diffusion (via
  cross-attention in LDM/Stable Diffusion) and remains one of the three encoders SD3/SDXL-class models
  concatenate — kept as a full entity (see DECISIONS.md D018) because the conditioning axis cannot be
  explained without its origin point.'
