summary: 'Fixes RAE''s rough edges: multilayer representation aggregation for a richer frozen feature,
  explicit combination of RAE with a REPA-style alignment loss, and a re-parameterized DiT output that
  fixes classifier-free guidance (which the original RAE struggled with). Reaches SOTA ImageNet gFID 1.06
  in 80 epochs, 10x faster convergence than the original RAE.'
