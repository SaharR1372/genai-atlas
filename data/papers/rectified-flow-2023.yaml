summary: 'Independently derives the same straight-path ODE idea as flow matching, and adds ''reflow'':
  iteratively re-coupling noise/data pairs along the learned ODE to make paths even straighter, enabling
  near-one-step sampling. The ''rectified'' in ''rectified flow transformer'' (SD3, FLUX) traces back
  here.'
