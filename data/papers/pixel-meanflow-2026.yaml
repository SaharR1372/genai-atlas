summary: 'Carries MeanFlow into pixel space, removing the tokenizer entirely while keeping one-step generation.
  The clearest convergence point of the pixel-space and one-step lines: if it holds, neither a VAE nor
  a foundation encoder is needed at either training or sampling time.'
explanation: null
abstract: 'Modern diffusion/flow-based models for image generation typically exhibit two core characteristics:
  (i) using multi-step sampling, and (ii) operating in a latent space. Recent advances have made encouraging
  progress on each aspect individually, paving the way toward one-step diffusion/flow without latents.
  In this work, we take a further step towards this goal and propose "pixel MeanFlow" (pMF). Our core
  guideline is to formulate the network output space and the loss space separately. The network target
  is designed to be on a presumed low-dimensional image manifold (i.e., x-prediction), while the loss
  is defined via MeanFlow in the velocity space. We introduce a simple transformation between the image
  manifold and the average velocity field. In experiments, pMF achieves strong results for one-step latent-free
  generation on ImageNet at 256x256 resolution (2.22 FID) and 512x512 resolution (2.48 FID), filling a
  key missing piece in this regime. We hope that our study will further advance the boundaries of diffusion/flow-based
  generative models.'
