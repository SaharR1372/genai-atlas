summary: Maps raw image pixels, text tokens and task-specific condition tokens into one shared token space
  processed by the same transformer blocks through joint self-attention, eliminating the VAE and the separate
  text encoder entirely. Editing and generation are literally the same forward pass, differing only in
  what occupies the condition-token slot. This makes it a genuinely different design point from BAGEL,
  Show-o2 or OmniGen2, which unify at the sequence level but still route generation through a distinct
  decoder or head. Scaled in the paper beyond 200B parameters, released at 8B, and so far trained only
  at 512x512.
explanation: null
abstract: The evolution of visual generative models has long been constrained by fragmented architectures
  relying on disjoint text encoders and external VAEs. In this report, we present HiDream-O1-Image, a
  natively unified generative foundation model via pixel-space Diffusion Transformer, that pioneers a
  paradigm shift from modular architectures to an end-to-end in-context visual generation engine. By mapping
  raw image pixels, text tokens, and task-specific conditions into a single shared token space, HiDream-O1-Image
  achieves a structural unification of multimodal inputs within an Unified Transformer (UiT) architecture.
  This native encoding paradigm eliminates the need for separate VAEs or disjoint pre-trained text encoders,
  allowing the model to treat diverse generation and editing tasks as a consistent in-context reasoning
  process. Extensive experiments show that HiDream-O1-Image excels across various generation tasks, including
  text-to-image generation, instruction-based editing, and subject-driven personalization. Notably, with
  only 8B parameters, HiDream-O1-Image (8B) achieves performance parity with or even surpasses established
  state-of-the-art models with significantly larger parameters (e.g., 27B Qwen-Image). Crucially, to validate
  the immense scalability of this paradigm, we successfully scale the architecture up to over 200B parameters.
  Experimental results demonstrate that this massive-scale version HiDream-O1-Image-Pro (200B+) unlocks
  unprecedented generative capabilities and superior performance, establishing new state-of-the-art benchmarks.
  Ultimately, HiDream-O1-Image highlights the immense potential of natively unified architectures and
  charts a highly scalable path toward next-generation multimodal AI.
