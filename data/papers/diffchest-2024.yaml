summary: A self-conditioned diffusion model, not a structural causal model, trained on 515,704 chest radiographs
  from 194,956 patients across the US and Europe to generate patient-specific counterfactual visualisations
  of confounders. Validated with high inter-reader agreement, Fleiss kappa at or above 0.8. The largest-scale
  evidence in this line, and it carries no causal graph.
explanation: null
abstract: DiffChest, a self-conditioned diffusion model trained on 515,704 chest radiographs from 194,956
  patients across the US and Europe, gives patient-specific explanations and visualises confounding factors
  that might mislead a classifier. Inter-reader agreement reaches Fleiss' kappa of 0.8 or higher, validating
  its ability to identify treatment-related confounders, which are detected at 10 to 100 percent prevalence
  rates. Pretraining also yields diagnostic accuracy across 11 chest conditions.
