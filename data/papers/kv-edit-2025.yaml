summary: 'The strictest preservation guarantee available: background tokens'' key and value pairs are
  cached and held fixed, so only edit-region tokens regenerate while attending to the frozen background.
  Inversion-free with constant cache overhead. It earns its precision claim architecturally rather than
  statistically, at the cost of struggling with edits where the background itself must change.'
explanation: null
abstract: Background consistency remains a significant challenge in image editing tasks. Despite extensive
  developments, existing works still face a trade-off between maintaining similarity to the original image
  and generating content that aligns with the target. Here, we propose KV-Edit, a training-free approach
  that uses KV cache in DiTs to maintain background consistency, where background tokens are preserved
  rather than regenerated, eliminating the need for complex mechanisms or expensive training, ultimately
  generating new content that seamlessly integrates with the background within user-provided regions.
  We further explore the memory consumption of the KV cache during editing and optimize the space complexity
  to $O(1)$ using an inversion-free method. Our approach is compatible with any DiT-based generative model
  without additional training. Experiments demonstrate that KV-Edit significantly outperforms existing
  approaches in terms of both background and image quality, even surpassing training-based methods. Project
  webpage is available at https://xilluill.github.io/projectpages/KV-Edit
