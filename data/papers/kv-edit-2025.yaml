summary: 'The strictest preservation guarantee available: background tokens'' key and value pairs are
  cached and held fixed, so only edit-region tokens regenerate while attending to the frozen background.
  Inversion-free with constant cache overhead. It earns its precision claim architecturally rather than
  statistically, at the cost of struggling with edits where the background itself must change.'
