summary: Adapts Stable Diffusion to chest X-rays by fine-tuning the U-Net and text encoder while freezing
  Stable Diffusion's natural-image VAE, and shows the synthetic images improve downstream classifiers
  by up to five points. The frozen natural-image latent is a pragmatic transfer-learning choice; the paper
  does not test whether that VAE discards clinically relevant detail.
