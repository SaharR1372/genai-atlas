summary: A systematic study of what actually limits masked autoregressive models, isolating the tokenizer
  and the bidirectional architecture as the binding constraints rather than the objective itself.
explanation: null
abstract: AutoRegressive (AR) models have made notable progress in image generation, with Masked AutoRegressive
  (MAR) models gaining attention for their efficient parallel decoding. However, MAR models have traditionally
  underperformed when compared to standard AR models. This study refines the MAR architecture to improve
  image generation quality. We begin by evaluating various image tokenizers to identify the most effective
  one. Subsequently, we introduce an improved Bidirectional LLaMA architecture by replacing causal attention
  with bidirectional attention and incorporating 2D RoPE, which together form our advanced model, MaskGIL.
  Scaled from 111M to 1.4B parameters, MaskGIL achieves a FID score of 3.71, matching state-of-the-art
  AR models in the ImageNet 256x256 benchmark, while requiring only 8 inference steps compared to the
  256 steps of AR models. Furthermore, we develop a text-driven MaskGIL model with 775M parameters for
  generating images from text at various resolutions. Beyond image generation, MaskGIL extends to accelerate
  AR-based generation and enable real-time speech-to-image conversion. Our codes and models are available
  at https://github.com/synbol/MaskGIL.
