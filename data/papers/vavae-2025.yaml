summary: 'Names and measures the reconstruction-generation dilemma directly: a VAE tuned purely for reconstruction
  fidelity becomes a *harder* space for a diffusion model to learn in. Fixes it by adding a vision-foundation-model
  alignment loss (VF Loss) during VAE training itself, then pairs the resulting VA-VAE with an improved
  DiT baseline (LightningDiT) for a 21x convergence speedup and SOTA ImageNet FID.'
