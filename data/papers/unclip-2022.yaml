summary: Generates a CLIP image embedding from a text prompt (the 'prior'), then decodes that embedding
  to pixels with a diffusion decoder. The first time a generative system's primary latent was a semantic,
  language-aligned feature space rather than a reconstruction-optimized autoencoder latent — the idea
  RAE and SVG revive three years later.
