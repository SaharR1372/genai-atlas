summary: 'The cleanest existing case of editing inside a genuinely frozen representation latent. It finds
  editing directions by Procrustes alignment and SVD directly in a frozen CLIP embedding space, transplanting
  the InterFaceGAN and GANSpace idea onto a foundation latent, and decodes with a diffusion-autoencoder
  decoder, reaching real images through DDIM inversion. It works, but only on narrow well-behaved domains:
  face attributes and a synthetic shape benchmark, not general instruction editing. The paper states its
  own costs plainly, including over-smoothing from lossy inversion and edited points occasionally leaving
  the decoder''s support.'
