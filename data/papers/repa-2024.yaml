summary: Adds a simple auxiliary loss that aligns a diffusion transformer's intermediate hidden states
  to a frozen DINOv2's features during training. Speeds up SiT-XL training by 17.5x and sets a new ImageNet
  FID, with no change to the model's own latent space or architecture — the paper RAE explicitly re-reads
  as 'why only align to the representation when you could generate directly inside it?'
explanation: null
