summary: Moves diffusion training from pixel space into the latent space of a pretrained autoencoder,
  cutting compute by orders of magnitude while keeping quality; introduces the VAE + UNet + cross-attention
  recipe every 'latent diffusion' system since has started from.
explanation: null
