summary: Freezes a pretrained UNet diffusion model entirely and adds a trainable copy of its encoder blocks,
  fed a spatial control signal (edges, depth, pose, segmentation) and connected back into the frozen backbone
  through zero-initialized convolutions, so training starts as a no-op and can never inject harmful noise
  into the base model. The origin of adapter-based spatial conditioning.
explanation: null
abstract: We present ControlNet, a neural network architecture to add spatial conditioning controls to
  large, pretrained text-to-image diffusion models. ControlNet locks the production-ready large diffusion
  models, and reuses their deep and robust encoding layers pretrained with billions of images as a strong
  backbone to learn a diverse set of conditional controls. The neural architecture is connected with "zero
  convolutions" (zero-initialized convolution layers) that progressively grow the parameters from zero
  and ensure that no harmful noise could affect the finetuning. We test various conditioning controls,
  eg, edges, depth, segmentation, human pose, etc, with Stable Diffusion, using single or multiple conditions,
  with or without prompts. We show that the training of ControlNets is robust with small (<50k) and large
  (>1m) datasets. Extensive results show that ControlNet may facilitate wider applications to control
  image diffusion models.
