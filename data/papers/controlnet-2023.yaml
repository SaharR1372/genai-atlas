summary: 'Freezes a pretrained UNet diffusion model entirely and adds a trainable copy of its encoder
  blocks, fed a spatial control signal (edges, depth, pose, segmentation) and connected back into the
  frozen backbone through zero-initialized convolutions, so training starts as a no-op and can never
  inject harmful noise into the base model. The origin of adapter-based spatial conditioning.'
