explained:
  depth: full-text
  before: Every diffusion transformer since latent diffusion inherited Stable Diffusion's autoencoder
    more or less unchanged, while research attention went to the denoiser.
  problem: That autoencoder compresses a 256-pixel image to a 32 by 32 grid of 4 channels using a reconstruction-only
    objective on a legacy convolutional design. The result captures local appearance but carries little
    global semantic structure, and costs roughly six times more encoding FLOPs than the alternative.
  idea: Stop training an encoder. Take a pretrained representation model, freeze it, treat its features
    as the generative latent, and train only a decoder back to pixels.
  method: DINOv2-B, SigLIP2-B or MAE-B serve as the frozen encoder; a ViT-XL decoder is trained with L1,
    LPIPS and adversarial losses. Unlike a VAE this preserves token count (around 256) while keeping high
    per-token dimensionality (768 channels). Three obstacles had to be cleared. First, a transformer whose
    width is below the token dimension cannot fit the data, which the paper proves as a loss lower bound,
    so width must meet or exceed 768. Second, noise schedules inherited from pixel and VAE inputs ignore
    token dimensionality; a dimension-dependent shift takes gFID from 23.08 to 4.81. Third, the decoder
    is trained on a discrete set of clean latents but must decode noisy diffusion output, so training
    it with added Gaussian noise takes gFID from 4.81 to 4.28. To meet the width requirement without quadratic
    cost, DiT^DH pairs a standard backbone with a shallow two-layer head of width 2048.
  evidence: gFID 1.51 without guidance and 1.13 with autoguidance at 800 epochs, against DiT-XL's 9.62
    and 2.27 at 1400 epochs. At 80 epochs it already reaches 2.16 unguided. Reconstruction FID is 0.49
    against SD-VAE's 0.62.
  limitations: Two findings bound the claim. Raw pixels at matched dimensionality reach only FID 51.09,
    so the gain comes from semantic structure and not from dimensionality alone. And DiT^DH gives no benefit
    on low-dimensional VAE latents, scoring 11.70 against a standard DiT's 7.13, so the architecture is
    specific to this regime rather than generally better.
  why_it_matters: It reverses the relationship between reconstruction and generation. In the VAE picture
    the latent exists to be decodable and generation consumes it; here the latent exists because it is
    meaningful, and decodability becomes the decoder's problem. The specificity of the fixes is itself
    the evidence that high-dimensional semantic latents are a different regime, not a drop-in swap.
