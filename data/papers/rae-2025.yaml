summary: 'Replaces the VAE with a Representation Autoencoder: a frozen pretrained encoder (DINO, SigLIP,
  or MAE) plus a lightweight trained ViT decoder. The resulting latent is high-dimensional (width must
  be >= token dimension) and semantically rich rather than reconstruction-only; needs a dimension-dependent
  noise schedule shift and noise-augmented decoding to train stably, and a DiT^DH diffusion head to decode
  well. Strong reconstruction *and* generation simultaneously, closing the dilemma VA-VAE/REPA-E only
  partially closed.'
