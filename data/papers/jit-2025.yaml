summary: Argues pixel-space diffusion was never unstable because of pixels — it was unstable because of
  epsilon-prediction. Switching to x-prediction on large patches lets a plain ViT ('Just image Transformers')
  match tokenizer-based DiT/PixArt-alpha at 256-1024px with no VAE, no pretraining, and no auxiliary losses
  at all.
