summary: Shows naive end-to-end VAE+diffusion training collapses the VAE's latent space, but training
  through the REPA alignment loss instead (with a batch-norm bridge and a stop-gradient on the diffusion
  loss's path back to the VAE) makes joint end-to-end training work — 17-45x faster than REPA/vanilla
  training, with SOTA ImageNet FID.
explanation: null
