summary: Identifies that RAE latents are severely anisotropic on a per-token basis, so the standard isotropic-Gaussian-to-data
  coupling forces curved, hard-to-distill denoising trajectories. Proposes a 'drifting field' distillation
  method built for this anisotropic geometry, reaching FID 1.48 with only 16 epochs of distillation.
