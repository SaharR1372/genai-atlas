summary: Diffusion transformers lack the UNet's coarse-to-fine hierarchy, so the question of which layer
  to inject into has no obvious answer. This paper finds the small set of vital layers that actually drive
  image formation and injects only there. The identification is empirical and has to be redone for each
  architecture.
