summary: Trains a family of pure self-supervised (no language) vision models from 0.3B to 7B parameters
  on the same web data CLIP uses, and finds visual SSL keeps improving with scale where CLIP-style training
  saturates — evidence against the assumption that a generation-ready semantic latent needs language supervision
  at all.
