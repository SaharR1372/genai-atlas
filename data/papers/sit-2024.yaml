summary: Reframes diffusion and flow matching as two points in one family of stochastic interpolants,
  isolating objective, coupling, and sampler as independent design choices on the exact DiT backbone;
  SiT-XL beats DiT-XL at matched size and FLOPs. Becomes the standard testbed the REPA/RAE line builds
  all its ablations on.
