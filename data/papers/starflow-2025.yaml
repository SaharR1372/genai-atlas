summary: Revives normalizing flows as a serious high-resolution generator using a transformer autoregressive
  flow with a deep-shallow architecture, trained in a pretrained autoencoder's latent space. Notable for
  an explicit ablation finding latent-space modeling beats pixel-level for this family, and for giving
  exact likelihoods that diffusion and flow matching do not.
