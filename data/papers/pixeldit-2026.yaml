summary: 'Splits the model in two: a patch-level DiT for global semantics and a pixel-level DiT that refines
  texture, end to end in raw pixels and extended to 1024px text-to-image. ImageNet 256 gFID 1.61 at 797M
  parameters. Its own limitations section names the field''s shared open problem: pixel data and noise
  distributions are more complex than latent ones and no mature training recipe exists.'
explanation: null
abstract: 'Latent-space modeling has been the standard for Diffusion Transformers (DiTs). However, it
  relies on a two-stage pipeline where the pretrained autoencoder introduces lossy reconstruction, leading
  to error accumulation while hindering joint optimization. To address these issues, we propose PixelDiT,
  a single-stage, end-to-end model that eliminates the need for the autoencoder and learns the diffusion
  process directly in the pixel space. PixelDiT adopts a fully transformer-based architecture shaped by
  a dual-level design: a patch-level DiT that captures global semantics and a pixel-level DiT that refines
  texture details, enabling efficient training of a pixel-space diffusion model while preserving fine
  details. PixelDiT achieves 1.61 FID on ImageNet 256 and 1.81 FID on ImageNet 512, surpassing existing
  pixel generative models. We further extend PixelDiT to text-to-image generation and pretrain it at the
  10242resolution in pixel space. It achieves 0.74 on GenEval and 83.5 on DPG-bench, approaching the best
  latent diffusion models. Code: https://github.com/NVlabs/PixelDiT'
