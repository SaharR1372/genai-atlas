summary: 'Independently arrives at the same core move as RAE within days: drop the VAE, generate directly
  in a frozen DINOv3 feature space, and add a lightweight residual branch specifically to recover the
  fine-grained pixel detail semantic features drop. The paper''s project page advertises large training
  and inference speedups; those specific figures could not be located in the paper body on a full-text
  read, so they are not repeated here.'
