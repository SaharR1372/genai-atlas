summary: Combines continuous-time consistency distillation with an adversarial term to reach 1-4 step
  text-to-image generation, reported faster than FLUX-schnell at comparable quality. Distillation-based,
  so it depends on a strong multi-step teacher — the contrast case against MeanFlow and Drifting, which
  train few-step behavior from scratch.
