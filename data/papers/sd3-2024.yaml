summary: Takes rectified flow to production scale with a new dual-stream 'MM-DiT' architecture (separate
  weights for text/image tokens, joined by shared attention) plus a logit-normal timestep-sampling schedule;
  establishes the flow-matching + MM-DiT recipe that FLUX, Qwen-Image, Seedream and most 2025 open T2I
  systems are variations of.
