summary: Pushes autoencoder spatial compression up to 128x (vs. the standard 8x) without losing reconstruction
  quality, via residual autoencoding and a staged high-resolution adaptation schedule — up to 19x faster
  inference than SD-VAE-f8 at matched or better FID. The dimension/compression trade-off RAE's high-dimensional
  latents sit at the opposite end of.
