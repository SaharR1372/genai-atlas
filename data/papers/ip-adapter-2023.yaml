summary: 'Moves adapter-based conditioning from spatial control to image-prompt conditioning: adds a
  second cross-attention branch with its own key/value projections just for image-prompt features,
  summed with the frozen model''s existing text cross-attention output. Only 22M parameters, and the
  decoupling keeps image and text prompts from fighting over one shared attention layer.'
