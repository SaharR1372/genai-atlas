explained:
  depth: full-text
  before: Representation autoencoders had been demonstrated on class-conditional ImageNet, a controlled
    setting with a thousand labels and one domain.
  problem: Whether the recipe survives open-vocabulary text-to-image, where prompts are freeform and the
    decoder must handle far more than a thousand categories.
  idea: 'Scale the frozen-encoder recipe to text-to-image and find out what actually limits it: raw data
    volume, or what the data contains.'
  method: 'SigLIP-2 So400M at patch 14 is the frozen encoder, giving 1152-dimensional tokens, chosen because
    language-supervised features are semantically structured enough to serve both understanding and generation.
    Text conditioning follows the MetaQuery framework directly: 256 learnable query tokens are prepended
    to the text prompt, a pretrained language model processes text and queries jointly, and a two-layer
    MLP connector projects into the diffusion transformer''s hidden space. The decoder is scaled on web,
    synthetic and text-rendering data.'
  evidence: The finding worth carrying is about data composition rather than scale. Generic web and synthetic
    data gave only marginal gains on ImageNet and moderate gains on more diverse images, while text rendering
    required targeted supervision — without text-specific data the decoder fails to reproduce glyph detail.
    Separately, under fine-tuning on high-quality data, VAE-based models degrade sharply after 64 epochs
    while RAE models stay stable through 256 with only mild decline.
  limitations: The visual-understanding results are explicitly described as preliminary exploration rather
    than competitive, and the paper notes that reaching that level would need any-resolution inputs, multimodal
    continual pretraining and much higher quality data. Test-time scaling gains are modest and framed
    as a first step.
  why_it_matters: 'It answers the scaling question for the representation-latent line and supplies its
    most distinctive evidence: stability under long fine-tuning, which is a different kind of claim from
    a better score and harder to attribute to tuning. It also settles how this line does conditioning,
    by adopting MetaQuery wholesale rather than designing a mechanism for the semantic latent.'
abstract: 'Representation Autoencoders (RAEs) have shown distinct advantages in diffusion modeling on
  ImageNet by training in high-dimensional semantic latent spaces. In this work, we investigate whether
  this framework can scale to large-scale, freeform text-to-image (T2I) generation. We first scale RAE
  decoders on the frozen representation encoder (SigLIP-2) beyond ImageNet by training on web, synthetic,
  and text-rendering data, finding that while scale improves general fidelity, targeted data composition
  is essential for specific domains like text. We then rigorously stress-test the RAE design choices originally
  proposed for ImageNet. Our analysis reveals that scaling simplifies the framework: while dimension-dependent
  noise scheduling remains critical, architectural complexities such as wide diffusion heads and noise-augmented
  decoding offer negligible benefits at scale Building on this simplified framework, we conduct a controlled
  comparison of RAE against the state-of-the-art FLUX VAE across diffusion transformer scales from 0.5B
  to 9.8B parameters. RAEs consistently outperform VAEs during pretraining across all model scales. Further,
  during finetuning on high-quality datasets, VAE-based models catastrophically overfit after 64 epochs,
  while RAE models remain stable through 256 epochs and achieve consistently better performance. Across
  all experiments, RAE-based diffusion models demonstrate faster convergence and better generation quality,
  establishing RAEs as a simpler and stronger foundation than VAEs for large-scale T2I generation. Additionally,
  because both visual understanding and generation can operate in a shared representation space, the multimodal
  model can directly reason over generated latents, opening new possibilities for unified models.'
