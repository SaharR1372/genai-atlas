summary: 'Tests whether the RAE recipe survives the jump from ImageNet to open-vocabulary text-to-image:
  scales a SigLIP-2-frozen RAE decoder on web, synthetic, and text-rendering data. Scale improves general
  fidelity but targeted data composition is still required for specific domains like rendered text; RAE-based
  models stay stable through 256 fine-tuning epochs where VAE-based models catastrophically overfit by
  epoch 64.'
