summary: Recasts generation as learning discrete-time Markov transition kernels over a continuous state,
  which unifies flow matching and continuous-token autoregression in one formulation instead of treating
  them as rival camps. Its fully-causal variant is reported as the first such model to match or beat flow-based
  methods on text-to-image.
