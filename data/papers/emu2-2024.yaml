summary: A 37B multimodal model that autoregressively predicts the next CLIP visual embedding alongside
  text tokens, then decodes embeddings back to pixels with a diffusion decoder — an autoregressive, MLLM-scale
  continuation of unCLIP's semantic-latent idea, and a direct ancestor of MetaQuery/BLIP3-o's frozen-MLLM-plus-diffusion-decoder
  pattern.
