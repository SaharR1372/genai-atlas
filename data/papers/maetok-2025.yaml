summary: 'Argues the key variable for generation quality is latent *geometry*, not whether the autoencoder
  is variational: a masked-modeling-trained, purely discriminative latent with fewer Gaussian-mixture
  modes is both easier to generate in and reconstructs well, hitting SOTA ImageNet FID with only 128 tokens
  and far less compute than prior tokenizers.'
