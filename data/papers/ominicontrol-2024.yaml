summary: 'Predates FLUX.1 Kontext by about seven months and generalizes the same core move beyond editing:
  reuse the DiT''s own VAE encoder and transformer blocks for the condition image, concatenate condition
  and generation tokens into one sequence, and add a dynamic position-encoding scheme so the same mechanism
  handles both spatially-aligned control (edges, depth) and non-aligned control (subject-driven generation)
  — for about 0.1% additional parameters versus a trained adapter.'
explanation: null
abstract: 'We present OminiControl, a novel approach that rethinks how image conditions are integrated
  into Diffusion Transformer (DiT) architectures. Current image conditioning methods either introduce
  substantial parameter overhead or handle only specific control tasks effectively, limiting their practical
  versatility. OminiControl addresses these limitations through three key innovations: (1) a minimal architectural
  design that leverages the DiT''s own VAE encoder and transformer blocks, requiring just 0.1% additional
  parameters; (2) a unified sequence processing strategy that combines condition tokens with image tokens
  for flexible token interactions; and (3) a dynamic position encoding mechanism that adapts to both spatially-aligned
  and non-aligned control tasks. Our extensive experiments show that this streamlined approach not only
  matches but surpasses the performance of specialized methods across multiple conditioning tasks. To
  overcome data limitations in subject-driven generation, we also introduce Subjects200K, a large-scale
  dataset of identity-consistent image pairs synthesized using DiT models themselves. This work demonstrates
  that effective image control can be achieved without architectural complexity, opening new possibilities
  for efficient and versatile image generation systems.'
