summary: 'Predates FLUX.1 Kontext by about seven months and generalizes the same core move beyond editing:
  reuse the DiT''s own VAE encoder and transformer blocks for the condition image, concatenate condition
  and generation tokens into one sequence, and add a dynamic position-encoding scheme so the same
  mechanism handles both spatially-aligned control (edges, depth) and non-aligned control (subject-driven
  generation) — for about 0.1% additional parameters versus a trained adapter.'
