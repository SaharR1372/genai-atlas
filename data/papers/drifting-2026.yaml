summary: Learns a generator mapping directly, rather than a score or an instantaneous velocity to be integrated
  at sampling time. Training evolves the mapping's pushforward distribution along a drifting field until
  it matches the data distribution, an equilibrium condition. The result is natively one-step at inference
  — not a distilled multi-step model — and reports 1.54 one-step FID on ImageNet 256 in latent space,
  1.61 in pixel space.
