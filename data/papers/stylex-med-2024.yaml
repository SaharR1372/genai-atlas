summary: StyleGAN-based counterfactual attribute discovery across eight tasks in retinal fundus, external
  eye and chest radiograph imaging, validated by an interdisciplinary expert panel. States explicitly
  that it is not designed to infer causality, and produces clinically useful counterfactual visualisations
  regardless, which is why it sits here as a challenge.
explanation: null
abstract: 'A workflow for generating hypotheses about which visual signals correlate with a classifier''s
  predictions: train a classifier, train a StyleGAN-based generator guided by it (StylEx), then extract
  and visualise the top attributes the classifier is sensitive to by modifying each independently to produce
  counterfactual visualisations, and finally review them with an interdisciplinary expert panel. Demonstrated
  on eight prediction tasks across retinal fundus photographs, external eye photographs and chest radiographs.
  Recovers known clinical features, exposes confounders beyond physiology such as chest X-ray underexposure
  and eye makeup, and surfaces previously unknown attributes. States explicitly that it is not designed
  to infer causality.'
