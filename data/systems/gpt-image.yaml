summary: OpenAI's image generation and editing family, available only through the API. No technical report
  exists, so the atlas records what the vendor's own documentation states and nothing more. OpenAI describes
  the underlying approach as autoregressive rather than diffusion, but publishes no architecture details,
  so it cannot be placed on the representation axis.
