summary: A from-scratch 13B text-to-image family built by Krea, notable for a style-transfer and style-mixing
  workflow rather than for a new architecture, and for being the summer's most widely downloaded open
  image model. A technical report exists but no arXiv paper, so it sits here as a system rather than a
  paper entry.
